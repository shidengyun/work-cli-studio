          - heading "无供应商锁定" [level=3] [ref=e658]
          - paragraph [ref=e659]: 自带 LLM 提供商、更换 智能体 后端、扩展 API。你拥有整个技术栈的控制权。
        - generic [ref=e660]:
          - heading "默认透明" [level=3] [ref=e661]
          - paragraph [ref=e662]: 每一行代码都可审计。确切了解你的 智能体 如何做决策、任务如何路由、数据流向何方。
        - generic [ref=e663]:
          - heading "社区驱动" [level=3] [ref=e664]
          - paragraph [ref=e665]: 与社区一起建设，而不仅仅是为社区建设。贡献技能、集成和 智能体 后端，让每个人受益。
    - generic [ref=e667]:
      - generic [ref=e668]:
        - paragraph [ref=e669]: 常见问题
        - heading "问与答。" [level=2] [ref=e670]
      - generic [ref=e671]:
        - generic [ref=e672]:
          - button "Multica 支持哪些编码 智能体？" [ref=e673]:
            - generic [ref=e674]: Multica 支持哪些编码 智能体？
            - img [ref=e676]
          - paragraph [ref=e678]: Multica 开箱即用支持 12 款 AI 编程工具：Antigravity、Claude Code、Codex、Cursor、Copilot、Gemini、Hermes、Kimi、Kiro CLI、OpenCode、OpenClaw、Pi。守护进程会自动检测本机已安装的 CLI 并为每款注册一个运行时。因为开源，你也可以自己添加后端。
        - generic [ref=e679]:
          - button "需要自托管吗，还是有云版本？" [ref=e680]:
            - generic [ref=e681]: 需要自托管吗，还是有云版本？
            - img [ref=e683]
          - paragraph [ref=e685]: 两者都有。你可以用 Docker Compose 或 Kubernetes 在自己的基础设施上自托管 Multica，也可以使用我们的托管云版本。你的数据，你选择。
        - generic [ref=e686]:
          - button "这和直接用编码 智能体 有什么区别？" [ref=e687]:
            - generic [ref=e688]: 这和直接用编码 智能体 有什么区别？
            - img [ref=e690]
          - paragraph [ref=e692]: 编码 智能体 擅长执行。Multica 添加的是管理层：任务队列、团队协作、技能复用、运行时监控，以及每个 智能体 在做什么的统一视图。把它想象成你的 智能体 的项目经理。
        - generic [ref=e693]:
          - button "智能体 能自主处理长时间任务吗？" [ref=e694]:
            - generic [ref=e695]: 智能体 能自主处理长时间任务吗？
            - img [ref=e697]
          - paragraph [ref=e699]: 可以。Multica 管理完整的任务生命周期——入队、领取、执行、完成或失败。智能体 主动报告阻塞并实时推送进度。你可以随时查看，也可以让它们运行整晚。
        - generic [ref=e700]:
          - button "我的代码安全吗？智能体 在哪里执行？" [ref=e701]:
            - generic [ref=e702]: 我的代码安全吗？智能体 在哪里执行？
            - img [ref=e704]
          - paragraph [ref=e706]: 智能体 在你的机器（本地守护进程）或你自己的云基础设施上执行。代码永远不会经过 Multica 服务器。平台只协调任务状态和广播事件。
        - generic [ref=e707]:
          - button "我可以运行多少个 智能体？" [ref=e708]:
            - generic [ref=e709]: 我可以运行多少个 智能体？
            - img [ref=e711]
          - paragraph [ref=e713]: 取决于你的硬件。每个 智能体 有可配置的并发限制，你可以连接多台机器作为运行时。开源版本没有任何人为限制。
